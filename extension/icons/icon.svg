<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0072CE" rx="16"/>
  
  <!-- ID Card shape -->
  <rect x="16" y="32" width="96" height="64" fill="white" rx="8"/>
  
  <!-- Chip (golden rectangle) -->
  <rect x="24" y="40" width="32" height="24" fill="#FFD700" rx="2"/>
  
  <!-- Chip contacts (simplified) -->
  <rect x="26" y="42" width="6" height="4" fill="#DAA520"/>
  <rect x="34" y="42" width="6" height="4" fill="#DAA520"/>
  <rect x="42" y="42" width="6" height="4" fill="#DAA520"/>
  <rect x="50" y="42" width="6" height="4" fill="#DAA520"/>
  
  <rect x="26" y="48" width="6" height="4" fill="#DAA520"/>
  <rect x="34" y="48" width="6" height="4" fill="#DAA520"/>
  <rect x="42" y="48" width="6" height="4" fill="#DAA520"/>
  <rect x="50" y="48" width="6" height="4" fill="#DAA520"/>
  
  <rect x="26" y="54" width="6" height="4" fill="#DAA520"/>
  <rect x="34" y="54" width="6" height="4" fill="#DAA520"/>
  <rect x="42" y="54" width="6" height="4" fill="#DAA520"/>
  <rect x="50" y="54" width="6" height="4" fill="#DAA520"/>
  
  <!-- Text lines (representing personal data) -->
  <rect x="24" y="72" width="80" height="4" fill="#E0E0E0" rx="2"/>
  <rect x="24" y="80" width="60" height="4" fill="#E0E0E0" rx="2"/>
  <rect x="24" y="88" width="70" height="4" fill="#E0E0E0" rx="2"/>
  
  <!-- Estonian flag colors (small accent) -->
  <rect x="92" y="40" width="16" height="4" fill="#0072CE"/>
  <rect x="92" y="44" width="16" height="4" fill="#000000"/>
  <rect x="92" y="48" width="16" height="4" fill="#FFFFFF"/>
</svg>

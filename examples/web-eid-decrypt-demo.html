<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EID-PD decrypt API demo</title>
</head>
<body>
  <h1>EID-PD decrypt API demo</h1>
  <p>Run npm ci, serve this repository over HTTPS, and install the EID-PD extension and native reader.</p>
  <button id="status">status()</button>
  <button id="cert">getDecryptCertificate()</button>
  <pre id="out"></pre>
  <script type="module">
    import * as eidpd from '../node_modules/web-eid-pd.js/index.js';
    const out = document.getElementById('out');
    document.getElementById('status').onclick = async () => {
      out.textContent = JSON.stringify(await eidpd.status(), null, 2);
    };
    document.getElementById('cert').onclick = async () => {
      out.textContent = JSON.stringify(await eidpd.getDecryptCertificate({ lang: 'et' }), null, 2);
    };
  </script>
</body>
</html>
